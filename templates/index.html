<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Diaria</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: #1a73e8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .logo p {
            font-size: 13px;
            color: #666;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 280px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            padding: 14px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
            color: #333;
            line-height: 1.6;
        }

        textarea:focus {
            border-color: #1a73e8;
        }

        textarea::placeholder {
            color: #aaa;
        }

        .btn {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover { background: #1557b0; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #aaa; cursor: not-allowed; }

        .status {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .status.success {
            background: #e6f4ea;
            color: #1e7e34;
            border: 1px solid #b7dfbe;
        }

        .status.error {
            background: #fce8e6;
            color: #c5221f;
            border: 1px solid #f5c6c5;
        }

        .status.loading {
            background: #e8f0fe;
            color: #1a73e8;
            border: 1px solid #c5d8fd;
        }

        .btn-limpiar {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: transparent;
            color: #666;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-limpiar:hover {
            border-color: #aaa;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">📋</div>
            <div>
                <h1>Agenda Diaria</h1>
                <p>Pega la agenda y súbela a Google Sheets</p>
            </div>
        </div>

        <label for="texto">Texto de la agenda</label>
        <textarea
            id="texto"
            placeholder="Pega aquí el texto de la agenda enviado por WhatsApp..."
        ></textarea>

        <button class="btn" onclick="procesar()">⬆️ Subir a Google Sheets</button>
        <button class="btn-limpiar" onclick="limpiar()">Limpiar</button>

        <div class="status" id="status"></div>
    </div>

    <script>
        async function procesar() {
            const texto = document.getElementById('texto').value.trim();
            const status = document.getElementById('status');
            const btn = document.querySelector('.btn');

            if (!texto) {
                mostrarStatus('Por favor pega el texto de la agenda.', 'error');
                return;
            }

            btn.disabled = true;
            mostrarStatus('⏳ Procesando agenda...', 'loading');

            try {
                const res = await fetch('/procesar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texto })
                });

                const data = await res.json();

                if (data.success) {
                    mostrarStatus(`✅ ${data.total} registro${data.total !== 1 ? 's' : ''} agregado${data.total !== 1 ? 's' : ''} correctamente a Google Sheets.`, 'success');
                    document.getElementById('texto').value = '';
                } else {
                    mostrarStatus(`❌ Error: ${data.error}`, 'error');
                }
            } catch (e) {
                mostrarStatus('❌ No se pudo conectar con el servidor.', 'error');
            }

            btn.disabled = false;
        }

        function limpiar() {
            document.getElementById('texto').value = '';
            document.getElementById('status').style.display = 'none';
        }

        function mostrarStatus(msg, tipo) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = `status ${tipo}`;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
